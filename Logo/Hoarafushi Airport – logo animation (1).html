<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoarafushi Airport – logo animation</title>
<style>
:root{--navy:#0A2540;--ink:#FFFFFF;--gold:#D4B069;--gold-dim:#A8803A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--navy);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;overflow:hidden}
main{display:flex;flex-direction:column;align-items:center;width:100%}
svg{width:min(66vw,340px);height:auto;overflow:visible}
.word{margin:18px 0 0;font-weight:400;font-size:clamp(22px,7vw,34px);letter-spacing:.34em;text-indent:.34em;white-space:nowrap;line-height:1}
.word span{display:inline-block}
.air{margin:14px 0 0;font-size:clamp(11px,3.2vw,14px);letter-spacing:.72em;text-indent:.72em;color:var(--gold);line-height:1}
.rule{width:min(40vw,150px);height:1px;background:var(--gold-dim);margin-top:16px;transform-origin:center}
button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:9px 20px;cursor:pointer;min-height:40px}
button:hover{border-color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.wing,.body,.tail,.dash{transform-box:fill-box}
.wr{transform-origin:0% 50%}
.wl{transform-origin:100% 50%}
.body{transform-origin:50% 100%}
.tail{transform-origin:50% 0%}
.dash{transform-origin:50% 100%}

@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes wingR{from{transform:scaleX(0) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
@keyframes wingL{from{transform:scaleX(0) rotate(14deg);opacity:0}to{transform:none;opacity:1}}
@keyframes dash{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rule{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes glide{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.play .body{animation:growY .7s cubic-bezier(.2,.8,.2,1) .15s both}
.play .tail{animation:growY .5s cubic-bezier(.2,.8,.2,1) .65s both}
.play .dash{animation:dash .3s ease-out both;animation-delay:calc(.95s + var(--d)*.14s)}
.play .wr{animation:wingR .85s cubic-bezier(.34,1.45,.64,1) 1.15s both}
.play .wl{animation:wingL .85s cubic-bezier(.34,1.45,.64,1) 1.15s both}
.play .float{animation:glide 5s ease-in-out 2.4s infinite}
.play .word span{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(1.9s + var(--i)*.05s)}
.play .rule{animation:rule .8s cubic-bezier(.2,.8,.2,1) 2.6s both}
.play .air{animation:fade .9s ease-out 2.9s both}

@media (prefers-reduced-motion:reduce){
  .play *{animation:none!important}
}
</style>
</head>
<body>
<main id="stage" class="play" aria-label="Hoarafushi Airport logo">
  <svg viewBox="70 24 240 164" role="img" aria-label="Frigate bird whose body is a runway with a gold centerline">
    <g class="float">
      <g fill="#FFFFFF">
        <path class="wing wr" d="M196 80L250 64L296 112L252 100L204 116Z"/>
        <path class="wing wl" d="M184 80L130 64L84 112L128 100L176 116Z"/>
        <path class="body" d="M190 36L194 48L200 128L180 128L186 48Z"/>
        <path class="tail" d="M180 126L166 176L188 150L190 154L192 150L214 176L200 126Z"/>
      </g>
      <g fill="#D4B069">
        <rect class="dash" style="--d:0" x="188" y="113" width="4" height="11"/>
        <rect class="dash" style="--d:1" x="188" y="95" width="4" height="11"/>
        <rect class="dash" style="--d:2" x="188" y="77" width="4" height="11"/>
        <rect class="dash" style="--d:3" x="188" y="59" width="4" height="11"/>
      </g>
    </g>
  </svg>
  <p class="word" aria-label="Hoarafushi"><span style="--i:0">H</span><span style="--i:1">O</span><span style="--i:2">A</span><span style="--i:3">R</span><span style="--i:4">A</span><span style="--i:5">F</span><span style="--i:6">U</span><span style="--i:7">S</span><span style="--i:8">H</span><span style="--i:9">I</span></p>
  <div class="rule"></div>
  <p class="air">AIRPORT</p>
</main>
<button id="replay" type="button">Replay</button>
<script>
(function(){
  var s=document.getElementById('stage');
  document.getElementById('replay').addEventListener('click',function(){
    s.classList.remove('play');
    void s.offsetWidth;
    s.classList.add('play');
  });
})();
</script>
</body>
</html>
